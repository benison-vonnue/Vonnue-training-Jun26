                        <span>Signup with Google</span>
                    </div>
                </div>
                <div class="signup-or-session">
                    <span class="seperator"><span>
                    <span class="or">OR</span>
                </div>
            </div>
            <div class="input-container">
                <label for="email">Email</label>
                <div class="input-area">
                    <input type="email" id="email">
                </div>
            </div>
            <div class="input-container">
                <label for="name">Full name</label>
                <div class="input-area">
                    <input type="text" id="name">
                </div>
            </div>
            <div class="input-container">
                <label for="password">Password</label>
                <div class="input-area">
                    <input type="password" id="password">
                </div>
            </div>
            <div class="input-container country-select">
                <label for="country">Country</label>
                <div class="input-area">
                    <select name="country" id="country">
                        <option value="">United States</option>
                        <option value="">India</option>
                        <option value="">Oman</option>
                        <option value="">Kuwait</option>
                        <option value="">Qatar</option>
                    </select>
                </div>
            </div>
            <div class="spacer"></div>
            <div class="input-container create-account">
                <div class="input-area">
                    <button><span>Create Account</span></button>
                </div>
            </div>
                <div class="signin-area">
                    <span>Already have an accunt? <span><a href="#">Signin</a></span></span>
                </div>
            </div>
        </div>
        <div class="footer">
            <div class="bottom-footer">
                <div class="credit">© Stripe</div>
                <div class="credit">Privacy & terms</div>
            </div>
        </div>
    </div>
